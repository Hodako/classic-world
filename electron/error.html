<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic World POS — সংযোগ স্থাপন করা হচ্ছে...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f1f5f9;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hind Siliguri", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid #e2e8f0;
      border-top-color: #0284c7;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
    p { color: #64748b; font-size: 13.5px; line-height: 1.5; margin-bottom: 22px; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eff6ff;
      color: #0284c7;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #0284c7;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      width: 100%;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    .btn-primary {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-primary:hover { background: #0369a1; }
    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
    }
    .btn-secondary:hover { background: #e2e8f0; }
    .tip {
      margin-top: 20px;
      font-size: 11.5px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Classic World POS</h2>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">ক্লাউড সার্ভারের সাথে সংযোগ স্থাপন করা হচ্ছে...</span>
    </div>
    <p>সফটওয়্যারটি স্বয়ংক্রিয়ভাবে <strong>https://classicworld-pos.web.app</strong> এ সংযুক্ত হচ্ছে। অনুগ্রহ করে কয়েক সেকেন্ড অপেক্ষা করুন।</p>
    <div class="btn-group">
      <button class="btn-primary" onclick="tryCloud()">পুনরায় চেষ্টা করুন (Retry Cloud)</button>
      <button class="btn-secondary" onclick="tryLocal()">অফলাইন লোকাল সার্ভার (Local 3142)</button>
    </div>
    <div class="tip">শর্টকাট: F5 (রিলোড) | F12 (ডিবাগ ইন্সপেক্ট)</div>
  </div>

  <script>
    const CLOUD_URL = 'https://classicworld-pos.web.app';
    const LOCAL_URL = 'http://127.0.0.1:3142';

    function tryCloud() {
      document.getElementById('status-text').textContent = 'Connecting to ' + CLOUD_URL + '...';
      window.location.href = CLOUD_URL;
    }

    function tryLocal() {
      document.getElementById('status-text').textContent = 'Connecting to ' + LOCAL_URL + '...';
      window.location.href = LOCAL_URL;
    }

    // Auto-check cloud every 2.5 seconds and load immediately when online
    setInterval(() => {
      fetch(CLOUD_URL, { mode: 'no-cors', cache: 'no-store' })
        .then(() => {
          window.location.href = CLOUD_URL;
        })
        .catch(() => {});
    }, 2500);
  </script>
</body>
</html>
