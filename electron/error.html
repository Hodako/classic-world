<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connecting to POS Server...</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #1e293b;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { margin: 0 0 8px 0; font-size: 20px; }
    p { color: #94a3b8; font-size: 14px; margin: 0 0 20px 0; }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Dream Fashion POS Server Initializing</h2>
  <p>Connecting to local POS engine on port 3141...</p>
  <button onclick="location.reload()">Retry Now</button>
  <script>
    setInterval(() => {
      fetch('http://127.0.0.1:3141')
        .then(() => window.location.href = 'http://127.0.0.1:3141')
        .catch(() => {});
    }, 2000);
  </script>
</body>
</html>
