<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Effect -->
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Light / Glows -->
  <circle cx="950" cy="180" r="350" fill="url(#glow)" />
  <circle cx="200" cy="550" r="280" fill="url(#glow)" opacity="0.6" />

  <!-- Subtle Grid Overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Left Column: Branding & Typography -->
  <!-- Tag / Badge -->
  <g transform="translate(90, 110)">
    <rect width="170" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="17" r="4" fill="#38bdf8" />
    <text x="32" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">NEXT-GEN POS</text>
  </g>

  <!-- Main Title -->
  <text x="90" y="225" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
    hakimQzz <tspan fill="url(#accentGrad)">POS</tspan>
  </text>

  <!-- Tagline -->
  <text x="90" y="285" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    Smart, fast, and secure retail point-of-sale system.
  </text>
  <text x="90" y="320" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
    Real-time inventory • Offline sync • Instant checkout
  </text>

  <!-- Feature Badges -->
  <g transform="translate(90, 440)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="135" height="42" rx="10" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="67" y="26" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">⚡ Ultra Fast</text>

    <!-- Badge 2 -->
    <rect x="150" y="0" width="150" height="42" rx="10" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="225" y="26" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">🔒 Multi-Branch</text>

    <!-- Badge 3 -->
    <rect x="315" y="0" width="140" height="42" rx="10" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="385" y="26" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">📊 Analytics</text>
  </g>

  <!-- Right Column: UI Mockup Preview -->
  <g transform="translate(710, 110)">
    <!-- Outer Card / POS Terminal Screen -->
    <rect width="400" height="410" rx="20" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

    <!-- Terminal Header -->
    <rect width="400" height="55" rx="20" fill="rgba(15, 23, 42, 0.6)" />
    <circle cx="30" cy="28" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="50" cy="28" r="6" fill="#eab308" opacity="0.8"/>
    <circle cx="70" cy="28" r="6" fill="#22c55e" opacity="0.8"/>
    <text x="360" y="33" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">LIVE SESSION</text>

    <!-- Stat Card 1: Today's Revenue -->
    <g transform="translate(25, 80)">
      <rect width="350" height="85" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="20" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Today's Total Sales</text>
      <text x="20" y="65" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">$14,820.50</text>
      <text x="330" y="60" text-anchor="end" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">+18.4%</text>
    </g>

    <!-- Stat Card 2: Quick Sale / Order Item -->
    <g transform="translate(25, 185)">
      <rect width="350" height="110" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      
      <!-- Order Row 1 -->
      <circle cx="30" cy="35" r="10" fill="#6366f1" fill-opacity="0.3"/>
      <text x="50" y="39" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">Barcode Scan #9842</text>
      <text x="330" y="39" text-anchor="end" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">$120.00</text>

      <line x1="20" y1="58" x2="330" y2="58" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

      <!-- Order Row 2 -->
      <circle cx="30" cy="82" r="10" fill="#22c55e" fill-opacity="0.3"/>
      <text x="50" y="86" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">Direct Checkout (NFC)</text>
      <text x="330" y="86" text-anchor="end" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">PAID</text>
    </g>

    <!-- Checkout Action Button Mock -->
    <g transform="translate(25, 315)">
      <rect width="350" height="52" rx="12" fill="url(#accentGrad)" />
      <text x="175" y="32" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">CHARGE ORDER ↵</text>
    </g>
  </g>
</svg>
